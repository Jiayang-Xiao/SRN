run_name: restricted_bridge_synthetic_dry_run
seeds: [13, 29]

data:
  type: synthetic
  feature_dim: 16
  synthetic_source_scenes: 3
  synthetic_frames_per_video: 12
  require_whole_video_split: true
  require_unseen_test_scene: true

model:
  feature_dim: 16
  scene_token_dim: 4
  scene_predictor_rank: 4
  context_dim: 2
  context_lambda: 0.25
  adversarial_weight: 0.1

training:
  epochs: 4
  learning_rate: 0.005
  loss_weights:
    normal: 0.05
    scene_prediction: 1.0
    capacity: 0.01
    retention: 1.0

scorer:
  knn_k: 5
  gaussian_shrinkage: 0.1
  prototype_count: 6

evaluation:
  source_threshold_fpr: 0.01
  metrics:
    - micro_auroc
    - macro_scene_auroc
    - auprc
    - tpr_at_1pct_fpr
    - tpr_at_0_1pct_fpr
    - false_alarm_events_per_hour
    - threshold_transfer
    - location_dependent_recall

matrix:
  - {name: raw_knn, method: raw, scorer: knn}
  - {name: raw_gaussian, method: raw, scorer: gaussian}
  - {name: raw_prototype, method: raw, scorer: prototype}
  - {name: scene_mean_prototype, method: scene_mean, scorer: prototype}
  - {name: background_mean_prototype, method: background_mean, scorer: prototype}
  - {name: adversarial_residual, method: adversarial_residual, scorer: prototype}
  - {name: full_srn, method: full_srn, scorer: prototype}
  - {name: srn_without_elos, method: srn_without_elos, scorer: prototype}
  - {name: elos_without_srn, method: elos_without_srn, scorer: prototype}
  - {name: srn_residual_only, method: srn_residual_only, scorer: prototype}
  - {name: calibration_only, method: calibration_only, scorer: prototype}

output:
  dir: runs/restricted_bridge_synthetic_dry_run
